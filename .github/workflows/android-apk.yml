# ساخت خودکار فایل APK اندروید
# اختیاری برای امضای ثابت: KEYSTORE_BASE64 / KEYSTORE_PASS / KEYSTORE_ALIAS
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync website into the app
        run: |
          rm -rf android/app/assets/site
          mkdir -p android/app/assets/site
          cp -R public/. android/app/assets/site/

      - name: Decode signing key (optional)
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/rahnama-release.keystore

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
        run: gradle --no-daemon assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: rahnama-apk
          path: out/*.apk
          if-no-files-found: error
